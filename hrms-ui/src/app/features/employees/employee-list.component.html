<section class="page">
  <header class="page-header">
    <div>
      <h2 class="page-title">Employees</h2>
      <p class="page-subtitle">Manage and view all employee records</p>
    </div>
    <div class="header-actions">
      <button mat-raised-button color="primary" class="btn-hover" (click)="create()">
        <mat-icon>person_add</mat-icon>
        New Employee
      </button>
    </div>
  </header>

  <mat-card class="card-elevated">
    <!-- Search bar -->
    <div class="search-bar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search employees</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (input)="applyFilter($event)" placeholder="Name, email, department…" />
      </mat-form-field>
    </div>

    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

    <div class="table-shell">
      <table mat-table [dataSource]="dataSource" matSort>

        <!-- Avatar -->
        <ng-container matColumnDef="avatar">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <div class="avatar">{{ initials(row) }}</div>
          </td>
        </ng-container>

        <!-- Name -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
          <td mat-cell *matCellDef="let row">
            <span class="emp-name">{{ row.firstName }} {{ row.lastName }}</span>
          </td>
        </ng-container>

        <!-- Email -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
          <td mat-cell *matCellDef="let row" class="text-muted">{{ row.email }}</td>
        </ng-container>

        <!-- Department -->
        <ng-container matColumnDef="department">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Department</th>
          <td mat-cell *matCellDef="let row" class="text-muted">
            {{ row.departmentName || '—' }}
          </td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row">
            <span class="badge" [ngClass]="row.status.toLowerCase()">
              {{ row.status }}
            </span>
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <div class="action-icons">
              <button mat-icon-button (click)="edit(row)"
                      matTooltip="Edit employee" color="primary">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button (click)="delete(row)"
                      matTooltip="Delete employee" color="warn">
                <mat-icon>delete_outline</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <!-- Empty state -->
        <tr class="mat-row" *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length">
            <div class="empty-state">
              <mat-icon>people_outline</mat-icon>
              <p>No employees found</p>
            </div>
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5,10,25]"
                   showFirstLastButtons></mat-paginator>
  </mat-card>
</section>
