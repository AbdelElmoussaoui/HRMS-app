<section class="page">
  <header class="page-header">
    <div>
      <h2 class="page-title">Manager Approvals</h2>
      <p class="page-subtitle">Review and action pending leave requests</p>
    </div>
    <div class="header-actions">
      <button mat-stroked-button class="btn-hover" routerLink="/dashboard/leave">
        <mat-icon>arrow_back</mat-icon>
        Back to list
      </button>
    </div>
  </header>

  <mat-card class="card-elevated">
    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

    <div class="table-shell">
      <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="employee">
          <th mat-header-cell *matHeaderCellDef>Employee</th>
          <td mat-cell *matCellDef="let row" class="emp-cell">
            {{ row.employeeName || row.employeeId }}
          </td>
        </ng-container>

        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Type</th>
          <td mat-cell *matCellDef="let row">
            <span class="type-chip" [ngClass]="row.type.toLowerCase()">{{ row.type }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="dates">
          <th mat-header-cell *matHeaderCellDef>Dates</th>
          <td mat-cell *matCellDef="let row" class="dates-cell">
            <mat-icon class="date-icon">date_range</mat-icon>
            {{ row.startDate }} — {{ row.endDate }}
          </td>
        </ng-container>

        <ng-container matColumnDef="reason">
          <th mat-header-cell *matHeaderCellDef>Reason</th>
          <td mat-cell *matCellDef="let row" class="reason-cell">{{ row.reason }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let row">
            <div class="approval-actions">
              <button mat-raised-button color="primary" class="btn-hover approve-btn"
                      (click)="approve(row)">
                <mat-icon>check</mat-icon>
                Approve
              </button>
              <button mat-stroked-button color="warn" class="btn-hover reject-btn"
                      (click)="reject(row)">
                <mat-icon>close</mat-icon>
                Reject
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length">
            <div class="empty-state">
              <mat-icon>task_alt</mat-icon>
              <p>No pending approvals — all caught up!</p>
            </div>
          </td>
        </tr>
      </table>
    </div>
  </mat-card>
</section>
