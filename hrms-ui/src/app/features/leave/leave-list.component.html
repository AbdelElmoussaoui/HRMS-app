<section class="page">
  <header class="page-header">
    <div>
      <h2 class="page-title">Leave Requests</h2>
      <p class="page-subtitle">Track and manage employee leave</p>
    </div>
    <div class="header-actions">
      <button mat-stroked-button class="btn-hover" routerLink="/dashboard/leave/approvals">
        <mat-icon>how_to_reg</mat-icon>
        Approvals
      </button>
      <button mat-raised-button color="primary" class="btn-hover" (click)="create()">
        <mat-icon>event_note</mat-icon>
        New Request
      </button>
    </div>
  </header>

  <mat-card class="card-elevated">
    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

    <div class="table-shell">
      <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="employee">
          <th mat-header-cell *matHeaderCellDef>Employee</th>
          <td mat-cell *matCellDef="let row" class="emp-cell">
            {{ row.employeeName || row.employeeId }}
          </td>
        </ng-container>

        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Type</th>
          <td mat-cell *matCellDef="let row">
            <span class="type-chip" [ngClass]="row.type.toLowerCase()">{{ row.type }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="dates">
          <th mat-header-cell *matHeaderCellDef>Dates</th>
          <td mat-cell *matCellDef="let row">
            <div class="dates-cell">
              <mat-icon class="date-icon">date_range</mat-icon>
              <span>{{ row.startDate }} — {{ row.endDate }}</span>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row">
            <span class="badge" [ngClass]="row.status.toLowerCase()">{{ row.status }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <div class="action-icons">
              <button mat-icon-button (click)="edit(row)"
                      matTooltip="Edit request" color="primary"
                      [disabled]="row.status !== 'PENDING'">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button (click)="delete(row)"
                      matTooltip="Delete request" color="warn"
                      [disabled]="row.status !== 'PENDING'">
                <mat-icon>delete_outline</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length">
            <div class="empty-state">
              <mat-icon>event_busy</mat-icon>
              <p>No leave requests found</p>
            </div>
          </td>
        </tr>
      </table>
    </div>
  </mat-card>
</section>
