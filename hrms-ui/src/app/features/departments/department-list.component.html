<section class="page">
  <header class="page-header">
    <div>
      <h2 class="page-title">Departments</h2>
      <p class="page-subtitle">Organize and manage your teams</p>
    </div>
    <div class="header-actions">
      <button mat-raised-button color="primary" class="btn-hover" (click)="create()">
        <mat-icon>add_business</mat-icon>
        New Department
      </button>
    </div>
  </header>

  <mat-card class="card-elevated">
    <!-- Search bar -->
    <div class="search-bar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search departments</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (input)="applyFilter($event)" placeholder="Name or description…" />
      </mat-form-field>
    </div>

    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

    <div class="table-shell">
      <table mat-table [dataSource]="dataSource" matSort>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
          <td mat-cell *matCellDef="let row">
            <div class="dept-name-cell">
              <div class="dept-icon">
                <mat-icon>business</mat-icon>
              </div>
              <span class="dept-name">{{ row.name }}</span>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
          <td mat-cell *matCellDef="let row" class="text-muted desc-col">
            {{ row.description || '—' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <div class="action-icons">
              <button mat-icon-button (click)="edit(row)" matTooltip="Edit" color="primary">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button (click)="delete(row)" matTooltip="Delete" color="warn">
                <mat-icon>delete_outline</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length">
            <div class="empty-state">
              <mat-icon>business</mat-icon>
              <p>No departments found</p>
            </div>
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5,10,25]" showFirstLastButtons></mat-paginator>
  </mat-card>
</section>
