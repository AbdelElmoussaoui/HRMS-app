<mat-sidenav-container class="shell">

  <!-- ─── Sidebar ─── -->
  <mat-sidenav #sidenav class="sidenav" [mode]="sidenavMode" [opened]="!isMobile">

    <!-- Brand -->
    <div class="brand">
      <app-logo [size]="38"></app-logo>
      <div class="brand-text">
        <span class="brand-name">HRMS</span>
        <span class="brand-tagline">HR Management</span>
      </div>
    </div>

    <!-- Nav -->
    <div class="nav-section">
      <p class="nav-label">Main menu</p>
      <nav>
        <a
          *ngFor="let item of navItems"
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="onNavClick()"
        >
          <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
          <span class="nav-label-text">{{ item.label }}</span>
        </a>
      </nav>
    </div>

    <!-- Footer: user menu + theme toggle -->
    <div class="sidenav-footer">
      <button class="user-chip" [matMenuTriggerFor]="userMenu" type="button">
        <div class="user-avatar">{{ userInitial }}</div>
        <span class="user-name">{{ username }}</span>
        <mat-icon class="chevron">expand_less</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu" yPosition="above" class="user-dropdown">
        <div class="menu-user-header">
          <div class="menu-avatar">{{ userInitial }}</div>
          <div>
            <div class="menu-username">{{ username }}</div>
            <div class="menu-role">Administrator</div>
          </div>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item disabled>
          <mat-icon>account_circle</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item disabled>
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sign out</span>
        </button>
      </mat-menu>

      <button
        mat-icon-button
        class="theme-toggle"
        (click)="themeService.toggle()"
        [matTooltip]="themeService.isDark ? 'Light mode' : 'Dark mode'"
        type="button"
      >
        <mat-icon>{{ themeService.isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </div>
  </mat-sidenav>

  <!-- ─── Main Content ─── -->
  <mat-sidenav-content class="main-content">

    <!-- Top Bar -->
    <header class="topbar">
      <button mat-icon-button class="menu-toggle" (click)="sidenav.toggle()" matTooltip="Toggle sidebar">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="topbar-spacer"></span>
      <div class="topbar-right">
        <span class="topbar-greeting">Hello, <strong>{{ username }}</strong></span>
      </div>
    </header>

    <!-- Page content -->
    <div class="page-outlet">
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
