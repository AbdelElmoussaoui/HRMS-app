spring:
  application:
    name: hrms
  datasource:
    url: jdbc:postgresql://localhost:5432/hrms
    username: hrms
    password: hrms
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operationsSorter: method

jwt:
  secret: change-this-to-a-long-secure-secret-key-at-least-32-chars
  expiration-ms: 3600000

storage:
  location: /home/abdel/Documents/test/hrms-storage
